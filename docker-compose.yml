services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: viaggio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-viaggio}
      POSTGRES_USER: ${POSTGRES_USER:-viaggio_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viaggio_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-viaggio_user} -d ${POSTGRES_DB:-viaggio}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: viaggio_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: viaggio_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgis://${POSTGRES_USER:-viaggio_user}:${POSTGRES_PASSWORD:-viaggio_password}@postgres:5432/${POSTGRES_DB:-viaggio}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      # In-container service hosts (.env targets the Windows host, not the container)
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - CHANNELS_REDIS_URL=redis://redis:6379/3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # F7 — production web: daphne ASGI server (HTTP + WS in one process) with
  # config.settings.production. The dev `web` (runserver) above stays the default.
  # Start with:
  #   docker compose --profile prod up --build --scale web=0
  # (--scale web=0 keeps the dev runserver container off port 8000)
  web_prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: viaggio_backend_prod
    restart: unless-stopped
    profiles: ["prod"]
    command: >
      sh -c "python manage.py migrate &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_URL=postgis://${POSTGRES_USER:-viaggio_user}:${POSTGRES_PASSWORD:-viaggio_password}@postgres:5432/${POSTGRES_DB:-viaggio}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      # In-container service hosts (.env targets the Windows host, not the container)
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - CHANNELS_REDIS_URL=redis://redis:6379/3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: viaggio_celery_worker
    restart: unless-stopped
    command: celery -A config worker --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgis://${POSTGRES_USER:-viaggio_user}:${POSTGRES_PASSWORD:-viaggio_password}@postgres:5432/${POSTGRES_DB:-viaggio}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      # In-container service hosts (.env targets the Windows host, not the container)
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - CHANNELS_REDIS_URL=redis://redis:6379/3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: viaggio_celery_beat
    restart: unless-stopped
    command: celery -A config beat --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgis://${POSTGRES_USER:-viaggio_user}:${POSTGRES_PASSWORD:-viaggio_password}@postgres:5432/${POSTGRES_DB:-viaggio}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      # In-container service hosts (.env targets the Windows host, not the container)
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - CHANNELS_REDIS_URL=redis://redis:6379/3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
    name: viaggio_postgres_data
  redis_data:
    name: viaggio_redis_data
